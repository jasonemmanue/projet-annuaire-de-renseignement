workflows:

  # ── Build iOS sans signing (vérification que ça compile) ──────
  ios-build-check:
    name: iOS Build Check
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: 3.27.4
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze lib
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Build iOS (no codesign)
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app

  # ── Build + deploy sur TestFlight (pour installer sur iPad) ──
  ios-testflight:
    name: iOS TestFlight Deploy
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: 3.27.4
      xcode: latest
      cocoapods: default
      groups:
        - apple_credentials
      vars:
        BUNDLE_ID: com.horemplus.app
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.horemplus.app
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: release/*
          include: true
      tag_patterns:
        - pattern: v*
          include: true
    scripts:
      - name: Get dependencies
        script: flutter pub get

      - name: Set up GoogleService-Info.plist
        script: |
          echo $GOOGLE_SERVICE_INFO | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Install CocoaPods
        script: cd ios && pod install

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Increment build number
        script: |
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" || echo 0)
          agvtool new-version -all $((LATEST_BUILD + 1))

      - name: Build IPA
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - sakamemmanuel@gmail.com
        notify:
          success: true
          failure: true
