workflows:

  # ── Build Android signé (AAB pour Google Play) ────────────────
  # PRÉREQUIS (une seule fois, dans l'interface Codemagic) :
  #   Teams > Code signing identities > Android keystores > Add keystore
  #     · fichier    : horemplus-release.jks
  #     · reference  : horemplus_keystore   (nom repris ci-dessous)
  #     · alias      : horemplus
  #     · mots de passe du keystore et de la clé
  # Déclenchement : pousser un tag `android-v1.0.0`, ou lancer à la main.
  android-release:
    name: Android AAB
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 21
      android_signing:
        - horemplus_keystore
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'android-v*'
          include: true
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze lib --no-fatal-infos --no-fatal-warnings
      # build.gradle.kts lit android/key.properties, non versionné : on le
      # reconstitue depuis les variables injectées par android_signing.
      - name: Generate key.properties
        script: |
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - name: Build AAB
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/**/*.aab
      - build/app/outputs/**/mapping.txt

  # ── Build iOS sans signing (vérification que ça compile) ──────
  ios-build-check:
    name: iOS Build Check
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        # Les branches de travail doivent aussi déclencher la vérification,
        # sinon un push hors `main` ne compile jamais côté iOS.
        - pattern: 'claude/*'
          include: true
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Build iOS (no codesign)
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app

  # ── Build signé + publication TestFlight ─────────────────────
  # PRÉREQUIS (une seule fois, dans l'interface Codemagic) :
  #   1. Teams > Integrations > App Store Connect : ajouter une clé API
  #      et la nommer exactement « Horem Plus ASC » (ou changer le nom ci-dessous).
  #   2. L'App ID com.horemplus.app doit exister dans App Store Connect.
  # Déclenchement : pousser un tag `v1.0.0`, ou lancer le workflow à la main.
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Horem Plus ASC
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.horemplus.app
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
