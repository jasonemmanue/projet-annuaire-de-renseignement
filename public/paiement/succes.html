<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paiement réussi — Horem+</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #005a9e 0%, #0071C2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #fff;
    }
    .card {
      background: #fff;
      color: #1a1a1a;
      border-radius: 24px;
      max-width: 420px;
      width: 100%;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .check-circle {
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: #16a34a;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pop 0.6s cubic-bezier(0.17, 0.89, 0.32, 1.28);
    }
    .check-circle svg { width: 52px; height: 52px; }
    @keyframes pop {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 12px; color: #0071C2; }
    .amount {
      font-size: 34px; font-weight: 900; color: #16a34a; margin: 8px 0 4px;
    }
    .sub { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 24px; }
    .badge {
      display: inline-block;
      background: #FEF3C7;
      color: #B45309;
      font-weight: 700;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 24px;
    }
    .info {
      background: #EFF6FF;
      border: 1px solid #BFDBFE;
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      color: #1e40af;
      line-height: 1.6;
    }
    .brand { margin-top: 28px; font-size: 13px; color: #999; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>🎉 Paiement réussi !</h1>
    <div class="badge">★ PACK PREMIUM ACTIVÉ</div>
    <p class="sub">
      Votre paiement a été confirmé avec succès.<br>
      Vos avantages Premium sont désormais actifs.
    </p>
    <div class="info">
      ✅ Vous pouvez <strong>fermer cette page</strong> et retourner dans l'application Horem+.
      Votre abonnement est déjà activé.
    </div>
    <p class="brand">Horem+ — Votre Immobilier au Cameroun</p>
  </div>
</body>
</html>
