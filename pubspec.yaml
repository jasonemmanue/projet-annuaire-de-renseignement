name: immoconnect
description: ImmoConnect - Application Immobilière Cameroun
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^17.0.0

  # Charts
  fl_chart: ^0.68.0

  # Publicités
  google_mobile_ads: ^5.1.0

  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  carousel_slider: ^4.2.1
  badges: ^3.1.2

  # Navigation
  go_router: ^14.6.3

  # State Management
  provider: ^6.1.1

  # Firebase
  firebase_core: ^3.14.0
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.9
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.7
  firebase_analytics: ^11.5.0
  firebase_app_check: ^0.3.2+1

  # Google Sign-In & Facebook
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.1.1

  # Maps
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Network
  http: ^1.1.2
  dio: ^5.4.0

  # Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.0.0

  # Image / Video
  image_picker: ^1.1.2
  photo_view: ^0.15.0
  video_player: ^2.9.2

  # File picking
  file_picker: ^8.1.7

  # Chat
  flutter_chat_ui: ^2.11.1

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  connectivity_plus: ^6.1.4
  permission_handler: ^11.4.0
  uuid: ^4.5.1
  timeago: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#0071C2"
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/operateurs/
    - assets/icons/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700