name: Android Build (.aab + .apk)

# Build l'App Bundle (.aab) et l'APK de release dans le cloud GitHub.
# Déclenchement :
#   - manuellement (onglet Actions → « Android Build » → Run workflow)
#   - à chaque push sur la branche d'auth email/mot de passe
#
# Les artefacts (app-release.aab / app-release.apk) sont téléchargeables
# depuis la page du run (section « Artifacts »). On ne commite AUCUN binaire
# dans le dépôt : GitHub héberge les artefacts de build.
#
# ⚠️ Signature : la config actuelle signe les release avec la clé DEBUG
# (android/app/build.gradle.kts → signingConfigs.getByName("debug")).
# → l'.aab produit est parfait pour TESTER (install direct, partage interne)
#   mais PAS pour un upload Google Play Store (qui exige une clé de release).
# Pour un build Play Store, ajoutez un keystore + secrets et une vraie
# signingConfig release (voir la doc en bas de ce fichier).

on:
  workflow_dispatch:
  push:
    branches:
      - claude/email-password-auth-1ayjmx

jobs:
  build-android:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      # Non bloquant : on veut l'.aab même si l'analyse remonte des warnings.
      - name: Analyze code
        continue-on-error: true
        run: flutter analyze lib

      - name: Build App Bundle (release)
        run: flutter build appbundle --release

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload App Bundle (.aab)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: horem-plus-appbundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload APK (.apk)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: horem-plus-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

# ──────────────────────────────────────────────────────────────────────────
# Pour un build signé Play Store (plus tard) :
#   1. Générer un keystore :
#      keytool -genkey -v -keystore upload-keystore.jks -keyalg RSA \
#        -keysize 2048 -validity 10000 -alias upload
#   2. Ajouter les secrets GitHub (Settings → Secrets → Actions) :
#      KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS
#   3. Décoder le keystore + générer android/key.properties avant le build,
#      et remplacer signingConfigs.getByName("debug") par une signingConfig
#      release dans android/app/build.gradle.kts.
# ──────────────────────────────────────────────────────────────────────────
